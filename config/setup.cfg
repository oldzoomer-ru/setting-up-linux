# ==================== Setup Configuration ====================
# Centralized configuration for all setup scripts and Ansible roles
# This file can be overridden via command-line or environment variables

# Distribution detection
DISTRO_FAMILY: "auto"  # auto, debian, redhat, arch
DISTRO_NAME: "auto"    # auto, ubuntu, debian, fedora, arch, redhat

# User configuration
DEV_USER: "{{ ansible_user | default(ansible_user_id) }}"
USERNAME: "{{ ansible_user | default(ansible_user_id) }}"

# Package package name mappings
ZRAM_PACKAGE_DEBIAN: "zram-generator"
ZRAM_PACKAGE_RHEL: "kd-zram"
FLATHUB_REMOTE: "flathub"

# Node.js configuration
NODEJS_VERSION: "26.x"    # latest LTS from NodeSource
NODEJS_MODULES: []

# Java configuration
JAVA_VERSION: 25          # OpenJDK version

# Docker configuration
DOCKER_GROUP: "docker"
DEV_USER_FOR_DOCKER: "{{ dev_user }}"

# VS Code configuration
VS_CODE_REPO: "https://packages.microsoft.com/repos/code"
VS_CODE_KEYRING: "/etc/apt/keyrings/microsoft.asc"

# Flatpak configuration
FLATHUB_URL: "https://flathub.org/repo/flathub.flatpakrepo"
MASK_OPENH264: true

# AI/LLM configuration
AI_MODEL: "qwen/qwen3.6-35b-a3b"
AI_LM_STUDIO_URL: "http://localhost:1234"
AI_MAX_CONTEXT: 262144

# System services
ENABLE_BLUETOOTH: true
ENABLE_ZRAM: true

# Git configuration
GIT_REPO: "https://github.com/oldzoomer/setting-up-linux.git"
GIT_MIRROR: "gitverse"

# End of configuration