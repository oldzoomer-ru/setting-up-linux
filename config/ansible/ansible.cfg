# Базовые настройки Ansible для этого репозитория.
# Всё реализовано на модулях ansible.core (ansible.builtin) и вынесено в роли.
# Внешние роли/коллекции не требуются — requirements.yml пуст.
[defaults]
inventory        = inventory.ini
host_key_checking = False
interpreter_python = auto_silent
forks            = 10
retry_files_enabled = False
stdout_callback  = yaml
# Локальные роли (roles/desktop и др.) + роли из Galaxy (~/.ansible/roles)
roles_path       = ./roles:~/.ansible/roles:/usr/share/ansible/roles

