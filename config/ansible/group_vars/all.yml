---
# Общие настройки (переопределяются через командную строку -e и config/setup.cfg)
# Centralized configuration - values from config/setup.cfg take precedence

# Read from centralized config - these will be overridden by -e flags if needed
nodejs_version: "{{ lookup('env', 'NODEJS_VERSION') | default('24.x') }}"
java_version: "{{ lookup('env', 'JAVA_VERSION') | default(25) }}"
dev_user: "{{ ansible_user | default(ansible_user_id) }}"

# Маппинг архитектуры ядра в имя архитектуры для apt
apt_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ('arm64' if ansible_architecture == 'aarch64' else 'armhf') }}"

# Селектор ноутбуков Gigabyte (определяется по железу, или вручную: -e gigabyte_laptop=true)
gigabyte_laptop: "{{ ('gigabyte' in (ansible_system_vendor | default('') | lower)) or ('gigabyte' in (ansible_product_name | default('') | lower)) or ('aorus' in (ansible_product_name | default('') | lower)) }}"
