---
# Системные/GNOME-настройки десктопа: ZRAM-своп, Flatpak, маскировка OpenH264.
# Реализовано с использованием модулей community.general для Flatpak.

- name: Install zram-generator (Debian)
  ansible.builtin.apt:
    name: "{{ zram_generator_package }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install zram-generator (RedHat)
  ansible.builtin.dnf:
    name: "{{ zram_generator_package }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Configure zram
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    mode: "0644"
    content: |
      [zram0]
      zram-size = {{ zram_swap_size }}

- name: Enable and start zram setup
  ansible.builtin.systemd:
    name: systemd-zram-setup@zram0.service
    state: started
    enabled: true
    daemon_reload: true

- name: Install Flatpak (Debian)
  ansible.builtin.apt:
    name: flatpak
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Flatpak (RedHat)
  ansible.builtin.dnf:
    name: flatpak
    state: present
  when: ansible_os_family == "RedHat"

- name: Add Flathub remote (system-wide)
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present
    method: system




