---
# Конфигурация клавиатуры на ноутбуках Gigabyte (hwdb-правило + keyd).
- name: Deploy hwdb rule for Gigabyte keyboard
  ansible.builtin.copy:
    content: |
      evdev:input:b0003v0414p8104e0111*
       KEYBOARD_KEY_7006f=fn
       KEYBOARD_KEY_70067=www
    dest: /etc/udev/hwdb.d/99-gigabyte.hwdb
    owner: root
    group: root
    mode: "0644"

- name: Update hwdb cache
  ansible.builtin.command: systemd-hwdb update
  changed_when: false

- name: Trigger udev reload
  ansible.builtin.command: udevadm trigger
  changed_when: false

- name: Install keyd (Debian)
  ansible.builtin.apt:
    name: keyd
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install keyd (RedHat)
  ansible.builtin.dnf:
    name: keyd
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure keyd config directory exists
  ansible.builtin.file:
    path: /etc/keyd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove old keyd configs
  ansible.builtin.file:
    path: "/etc/keyd/{{ item }}"
    state: absent
  loop:
    - copilot.conf
    - screenshot.conf

- name: Deploy keyd unified config
  ansible.builtin.copy:
    content: |
      [ids]
      *

      [main]
      # Аккорд для Скриншота (на базе S, Shift, Meta)
      s+leftshift+leftmeta = print

      # Кнопка Copilot активирует слой для GoldED
      f23+leftshift+leftmeta = layer(fido)

      [fido]
      i = insert
      w = f2
    dest: /etc/keyd/default.conf
    owner: root
    group: root
    mode: "0644"

- name: Restart keyd if running
  ansible.builtin.systemd:
    name: keyd
    state: restarted
  register: keyd_restart
  failed_when: keyd_restart is failed and 'Could not find the requested service' not in keyd_restart.msg

# AORUS Laptop DKMS module and control setup
- name: Install DKMS and linux headers (Debian)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - dkms
    - linux-headers-{{ kernel_release }}
  when: ansible_os_family == "Debian"

- name: Install DKMS and linux headers (RedHat)
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
    - dkms
    - linux-headers-{{ kernel_release }}
  when: ansible_os_family == "RedHat"

- name: Download gigabyte-laptop-wmi master tarball
  ansible.builtin.get_url:
    url: "https://github.com/tangalbert919/gigabyte-laptop-wmi/tarball/master"
    dest: "/tmp/gigabyte-laptop-wmi.tar.gz"
    mode: "0644"
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"

- name: Extract gigabyte-laptop-wmi master source
  ansible.builtin.command: >
    tar -xzf /tmp/gigabyte-laptop-wmi.tar.gz -C /tmp/
  args:
    creates: "/tmp/tangalbert919-gigabyte-laptop-wmi"
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
  changed_when: false

- name: Set version to dev in dkms.conf
  ansible.builtin.sed:
    path: "/tmp/tangalbert919-gigabyte-laptop-wmi/dkms.conf"
    regexp: "PACKAGE_VERSION=@PKGVER@"
    replace: "PACKAGE_VERSION=\"dev\""
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
  changed_when: false

- name: Create DKMS tarball for gigabyte-laptop-wmi
  ansible.builtin.command: >
    tar -czf /tmp/dkms-aorus.tar.gz
    -C /tmp
    Makefile aorus-laptop.c dkms.conf
  args:
    chdir: "/tmp/tangalbert919-gigabyte-laptop-wmi"
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
  changed_when: false

- name: Install gigabyte-laptop-wmi via DKMS
  ansible.builtin.command: dkms ldtarball /tmp/dkms-aorus.tar.gz
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
  changed_when: false

- name: Load aorus-laptop module
  ansible.builtin.module_command: modprobe aorus-laptop
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
  changed_when: false

- name: Setup MOK keys for Secure Boot
  ansible.builtin.command: >
    sh -c 'if [ -f /var/lib/dkms/mok.key ]; then
      cp /var/lib/dkms/mok.key /etc/ && cp /var/lib/dkms/mok.pub /etc/ &&
      echo "Existing MOK key found" || echo "No existing key"
    else
      echo "No existing MOK key, will create new one"
    fi'
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
  changed_when: false

- name: Install aorus-laptop-control
  ansible.builtin.command: >
    cd /tmp && git clone https://github.com/vladkoisnych/aorus-laptop-control.git &&
    cd aorus-laptop-control && sudo ./install.sh
  args:
    creates: "/usr/local/bin/aorusctl"
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
  changed_when: false

- name: Enable aorusctl services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - aorusctl-web.service
    - aorusctld.service
    - aorusctl-profile.service
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
