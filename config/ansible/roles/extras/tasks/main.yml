---
# Дополнительные инструменты разработки (DEB и RPM).
- name: Install additional dev tools (Debian)
  ansible.builtin.apt:
    name: "{{ dev_packages_debian }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install additional dev tools (RedHat)
  ansible.builtin.dnf:
    name: "{{ dev_packages_rhel }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Install uv Python package manager
  community.general.uv_python:
    state: present
  when: ansible_os_family == "Debian" or ansible_os_family == "RedHat"
