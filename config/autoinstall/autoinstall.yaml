autoinstall:
  version: 1
  interactive-sections:
    - network
    - identity
    - storage
    - postinstall
  locale: "ru_RU.UTF-8"
  timezone: "Europe/Moscow"
  keyboard:
    layout: "us,ru"
    toggle: "caps_toggle"
  refresh-installer:
    update: true
  source:
    id: "ubuntu-desktop-minimal"
  updates: all
  codecs:
    install: true
  drivers:
    install: true
  kernel:
    flavor: hwe
  kernel-crash-dumps:
    enabled: false
  shutdown: poweroff
  # Post-install configuration
  postinstall:
    # Run first-boot initialization script
    # This injects settings from GitHub and runs Ansible setup
    run_command: "/tmp/setting-up-linux/config/autoinstall/first-boot-setup.sh"
    # To inject settings from GitHub, set GITHUB_TOKEN environment variable:
    # GITHUB_TOKEN=your_token_here ./setup-wrapper.sh
    # To skip GitHub injection, run without the token
    # Note: On first actual run, remove --dry-run equivalent from wrapper
